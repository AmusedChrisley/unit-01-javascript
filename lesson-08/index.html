<script>

let day = prompt("Say a number from 1-7")
switch(day){

    alert("Monday: Test for U.S History");
    break;
    case "2":
    alert("Tuesday: Final for Pre-Calcus");
    break;
    case "3":
    alert("Wednesday: AP Government Exam");

    alert("Friday: Chemistry Regents");
    break;
    case "6": case "7":
    alert("IT'S THE WEEKEND YAYYYY");
    break;
    default:
    alert("Invalid Day")
}


</script>
