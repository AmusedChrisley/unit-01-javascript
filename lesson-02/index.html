<script>
    let score = 10;              // 1 10
    score += 5;                  // 2 15
    score *= 2;                  // 3 30
    let bonus = score % 7;       // 4 2
    let old = score++;           // 5 28 31
    score -= bonus;              // 6 29 30
    let next = ++score;          // 7 30 31
    score /= 3;                  // 8 10 3
    bonus--;                     // 9 1  29
    score = score + bonus * 4;   // 10 146
    
    // 1. Why is old 28 but score 29 after line 6?
    // A: Old is 29 after line 6 because score++ increases the value by 1
    // 2. Why doesn’t line 10 give 44?
    // A: Line 10 gives 28 because you have to multiply the bonus by 4 before you add the score
    // 3. What would score be if line 3 came before line 2?
    // A: 25

    console.log(score, bonus, old, next)
    </script>
