<!DOCTYPE html>
<html>
<head>
  <title>Gradebook</title>
</head>
<body>
  <h1>Period 3 Gradebook</h1>
  <ul id="gradebook"></ul>
  <h2>Honor Roll</h2>
  <ul id="honor"></ul>

  <script>
    let students = [
      { name: "Maya", average: 94.5 },
      { name: "Leo", average: 81.4 },
      { name: "Priya", average: 67.8 },
      { name: "Sam", average: 88 },
      { name: "Jordan", average: 72.3 }
    ];
    let list = document.getElementById("gradebook");
    
    //Core 1, stored students in list
    for (let i = 0; i < students.length; i++) {
       let student = students[i];
       let li = document.createElement("li");
        li.textContent = student.name + ": " + student.average
        list.appendChild(li);
    }
    let para = document.createElement("p");
    para.textContent = " Report for " + students.length + " students" 
    document.body.appendChild(para);
    // Write your code here, one comment above each task

  </script>
</body>
</html>
